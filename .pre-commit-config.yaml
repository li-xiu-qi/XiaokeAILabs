# 提交前钩子。
#
# 安装：pre-commit install
# 手工全量检查：python scripts/check_large_files.py --all
#
# 注意：本文件里的 check-added-large-files 历史上**从未生效**——仓库里没有
# .git/hooks/pre-commit，等于规则写了但没装。2026-10-19 实测确认，本地 .git
# 因此涨到 608MB（411MB 原始训练图 + 33.6MB 数据集）。现在改用仓库自带脚本，
# 把拦截逻辑放进版本库，不依赖各自机器的 pre-commit 环境，并给出可操作的
# 处理建议，而不只是一句 "file is larger than"。
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml

-   repo: local
    hooks:
    -   id: check-large-files
        name: 拦截超过 10MB 的文件（防止公开仓被大资产拖慢）
        entry: python scripts/check_large_files.py
        language: system
        pass_filenames: true
        # 二进制资产最容易被误提交，文本文件 10MB 已属异常，一并检查
        types: [file]

-   repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
    -   id: black
        language_version: python3
        args: [--line-length=100]
