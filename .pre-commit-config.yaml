# 提交前钩子。
#
# 安装：pre-commit install
# 手工全量检查：python scripts/check_large_files.py --all
#
# 文件大小也可通过仓库自带钩子检查；安装钩子会覆盖现有同名钩子。
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml

-   repo: local
    hooks:
    -   id: check-large-files
        name: 拦截超过 10MB 的文件（防止公开仓被大资产拖慢）
        entry: python scripts/check_large_files.py
        language: system
        pass_filenames: true
        # 二进制资产最容易被误提交，文本文件 10MB 已属异常，一并检查
        types: [file]

-   repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
    -   id: black
        language_version: python3
        args: [--line-length=100]
