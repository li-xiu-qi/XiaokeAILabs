<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Table structure recognition: original versus cropped input</title>
<desc id="desc">One synthetic table was tested twice. The original image produced an extra row spanning three columns; a manually cropped input produced four rows of three cells. These are observations for one sample and do not include OCR.</desc>
<rect width="800" height="450" fill="#edf3ef"/><circle cx="770" cy="10" r="130" fill="#dce9df"/><circle cx="25" cy="440" r="100" fill="#e0eae1"/>
<g font-family="Arial,sans-serif"><text x="38" y="49" font-size="20" font-weight="700" letter-spacing="2" fill="#416a58">TABLE STRUCTURE</text><text x="38" y="85" font-size="27" font-weight="700" fill="#18382d">One table, two input regions</text></g>
<rect x="38" y="108" width="724" height="115" rx="14" fill="#fff" stroke="#c1d2c5" stroke-width="2"/><rect x="38" y="237" width="724" height="115" rx="14" fill="#fff" stroke="#c1d2c5" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#25493a"><text x="57" y="143" font-size="19" font-weight="700">Original image</text><text x="57" y="168" font-size="15">includes white margin</text><text x="57" y="272" font-size="19" font-weight="700">Manual crop</text><text x="57" y="297" font-size="15">known coordinates</text></g>
<g fill="#f1f5f1" stroke="#aabfb0" stroke-width="2"><rect x="230" y="125" width="115" height="80" rx="5"/><rect x="230" y="254" width="115" height="80" rx="5"/></g>
<g fill="#fff" stroke="#628b72" stroke-width="2"><rect x="246" y="148" width="83" height="37"/><rect x="236" y="259" width="103" height="70"/></g>
<g fill="none" stroke="#8eb49b" stroke-width="1.5"><path d="M274 148v37m28-37v37m-56-28h83m-83 9h83m-83 10h83"/><path d="M270 259v70m35-70v70m-69-52h103m-103 18h103m-103 17h103"/></g>
<g fill="none" stroke="#83a494" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M357 165h55m-9-8 9 8-9 8"/><path d="M357 294h55m-9-8 9 8-9 8"/></g>
<g fill="#f5f8f5" stroke="#aac1b0" stroke-width="2"><rect x="424" y="134" width="105" height="62" rx="10"/><rect x="424" y="263" width="105" height="62" rx="10"/></g><g font-family="Arial,sans-serif" fill="#234d3d" text-anchor="middle"><text x="476" y="163" font-size="18" font-weight="700">SLANet+</text><text x="476" y="182" font-size="13">structure</text><text x="476" y="292" font-size="18" font-weight="700">SLANet+</text><text x="476" y="311" font-size="13">structure</text></g>
<g fill="none" stroke="#83a494" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M537 165h29m-9-8 9 8-9 8"/><path d="M537 294h29m-9-8 9 8-9 8"/></g>
<g stroke-width="2"><rect x="578" y="124" width="98" height="82" fill="#fff" stroke="#6c967b"/><rect x="578" y="124" width="98" height="17" fill="#f6dfd0" stroke="#c78262"/><path d="M578 157h98m-98 16h98m-98 16h98m-65-48v65m33-65v65" fill="none" stroke="#8eb49b"/><rect x="578" y="255" width="98" height="78" fill="#fff" stroke="#6c967b"/><path d="M611 255v78m33-78v78m-66-59h98m-98 19h98m-98 20h98" fill="none" stroke="#8eb49b"/></g>
