<rect x="38" y="372" width="724" height="48" rx="10" fill="#234d3d"/><text x="58" y="401" font-family="Arial,sans-serif" font-size="17" fill="#fff">ONE SYNTHETIC SAMPLE · STRUCTURE ONLY · NO OCR</text>
</svg>