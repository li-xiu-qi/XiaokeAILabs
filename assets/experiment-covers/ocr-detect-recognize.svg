<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Text detection and recognition on a synthetic table</title><desc id="desc">PP-OCRv5 detects text polygons, axis-aligned rectangles are cropped, and a recognition model transcribes each crop. Twelve outputs matched the known text on one synthetic table; this does not evaluate table structure.</desc>
