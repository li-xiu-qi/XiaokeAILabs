<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Synthetic image data and student training</title>
<desc id="desc">Teacher-generated and student-generated image datasets train two student adapters, which are compared on held-out prompts. This diagram illustrates the design, not a claim of improved quality.</desc>
