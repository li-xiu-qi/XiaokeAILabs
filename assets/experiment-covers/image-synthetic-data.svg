<g><rect x="262" y="126" width="200" height="106" rx="14" fill="#d8ebe0" stroke="#9ac0a6" stroke-width="2"/><rect x="262" y="269" width="200" height="106" rx="14" fill="#f5ebdc" stroke="#d9c1a4" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#25493a" text-anchor="middle"><text x="362" y="169" font-size="20" font-weight="700">Student + LoRA</text><text x="362" y="197" font-size="16">teacher-data run</text><text x="362" y="312" font-size="20" font-weight="700">Student + LoRA</text><text x="362" y="340" font-size="16">self-data run</text></g></g>
