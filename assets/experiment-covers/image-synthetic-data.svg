<text x="42" y="92" fill="#18382d" font-family="Arial,sans-serif" font-size="27" font-weight="700">Two data sources · one student</text>
<g fill="none" stroke="#83a494" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M220 179H260m-10-9 10 9-10 9"/><path d="M220 322H260m-10-9 10 9-10 9"/><path d="M463 179h43v70h38m-10-9 10 9-10 9"/><path d="M463 322h43v-73"/></g>
