name: 仓库体积闸门

# 本地钩子可以用 git commit --no-verify 绕过，这层绕不过。
# 本仓的教训是：体积规则一旦只写在本机配置里就形同虚设
# （.pre-commit-config.yaml 从未安装执行，.git 涨到 608MB）。
# 所以体积约束同时放在 pre-commit 与 CI 两处，任何一条路径进仓库都要过。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  size-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 单文件体积检查（>10MB 拦截）
        run: python scripts/check_large_files.py --all

      - name: notebook 输出检查
        run: python scripts/check_notebook_outputs.py --all

      - name: 克隆体积预算（全历史打包 >30MB 拦截）
        run: |
          packed=$(git rev-list --objects --all \
            | awk '{print $1}' | sort -u \
            | git pack-objects --stdout -q | wc -c)
          mb=$((packed / 1048576))
          echo "仓库全历史打包体积：${mb} MB"
          if [ "$mb" -gt 30 ]; then
            echo "::error::仓库体积 ${mb}MB 超出 30MB 预算。"
            echo "常见原因：数据集/模型入库、图片未压缩、notebook 带输出。"
            echo "处置见 scripts/check_large_files.py 的提示。"
            exit 1
          fi
