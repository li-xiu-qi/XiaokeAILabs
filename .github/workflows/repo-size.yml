name: 仓库体积闸门

# CI 检查受跟踪文件大小、notebook 输出及仓库历史打包体积。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  size-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 单文件体积检查（>10MB 拦截）
        run: python scripts/check_large_files.py --all

      - name: notebook 输出检查
        run: python scripts/check_notebook_outputs.py --all

      - name: 检查仓库历史打包体积
        run: |
          packed=$(git rev-list --objects HEAD \
            | awk '{print $1}' | sort -u \
            | git pack-objects --stdout -q | wc -c)
          mb=$((packed / 1048576))
          echo "仓库全历史打包体积：${mb} MB"
          if [ "$mb" -gt 35 ]; then
            echo "::error::仓库体积 ${mb}MB 超出 35MB 预算。"
            echo "常见原因：数据集/模型入库、图片未压缩、notebook 带输出。"
            echo "处置见 scripts/check_large_files.py 的提示。"
            exit 1
          fi
