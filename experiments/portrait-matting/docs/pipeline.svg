<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
<title id="title">Portrait matting evaluation pipeline</title><desc id="desc">An input photo is processed by RVM to produce a soft alpha matte. The prediction is compared with a reference mask for region and boundary metrics.</desc>
<rect width="1280" height="410" rx="24" fill="#142127"/><circle cx="1190" cy="-10" r="170" fill="#20433f" opacity=".55"/><g font-family="Arial,sans-serif"><text x="55" y="67" fill="#f0f8f3" font-size="29" font-weight="700">Portrait matting: beyond the silhouette</text><text x="55" y="100" fill="#96adaf" font-size="15" letter-spacing="1">SINGLE FRAME  /  SOFT ALPHA  /  REGION + EDGE</text>
<rect x="54" y="148" width="238" height="188" rx="17" fill="#20353a" stroke="#39575a"/><text x="76" y="180" fill="#a7c1bc" font-size="13">01 / INPUT</text><rect x="76" y="200" width="80" height="100" rx="8" fill="#40605c"/><circle cx="116" cy="227" r="13" fill="#a9c7b5"/><path d="M91 284c0-25 11-39 25-39s25 14 25 39" fill="#a9c7b5"/><text x="172" y="233" fill="#f0f8f3" font-size="17">RGB photo</text><text x="172" y="258" fill="#a7c1bc" font-size="13">one frame</text>
<path d="M303 242h35" stroke="#7bc6aa" stroke-width="3"/><path d="M330 235l9 7-9 7" fill="none" stroke="#7bc6aa" stroke-width="3"/><rect x="352" y="148" width="241" height="188" rx="17" fill="#20353a" stroke="#39575a"/><text x="375" y="180" fill="#a7c1bc" font-size="13">02 / PREDICT</text><text x="375" y="226" fill="#f0f8f3" font-size="20" font-weight="700">RVM MobileNetV3</text><text x="375" y="256" fill="#a7c1bc" font-size="14">Reset temporal state</text><text x="375" y="284" fill="#a7c1bc" font-size="14">Alpha values: 0 to 1</text>
<path d="M604 242h35" stroke="#7bc6aa" stroke-width="3"/><path d="M631 235l9 7-9 7" fill="none" stroke="#7bc6aa" stroke-width="3"/><rect x="652" y="148" width="240" height="188" rx="17" fill="#20353a" stroke="#39575a"/><text x="675" y="180" fill="#a7c1bc" font-size="13">03 / COMPARE</text><text x="675" y="226" fill="#f0f8f3" font-size="19" font-weight="700">Reference alpha</text><rect x="675" y="250" width="180" height="18" rx="9" fill="#fff"/><rect x="675" y="250" width="180" height="18" rx="9" fill="url(#gradient)"/><text x="675" y="291" fill="#a7c1bc" font-size="13">background → foreground</text>
<path d="M903 242h35" stroke="#7bc6aa" stroke-width="3"/><path d="M930 235l9 7-9 7" fill="none" stroke="#7bc6aa" stroke-width="3"/><rect x="952" y="148" width="270" height="188" rx="17" fill="#1e4942" stroke="#65b99c"/><text x="975" y="180" fill="#b1d8c9" font-size="13">04 / EVALUATE</text><text x="975" y="226" fill="#f0f8f3" font-size="19" font-weight="700">Region + boundary</text><text x="975" y="256" fill="#c1dfd1" font-size="14">IoU · F1 · alpha error</text><text x="975" y="285" fill="#a7c9bd" font-size="13">Per image, then average</text></g><defs><linearGradient id="gradient"><stop stop-color="#15272b"/><stop offset="1" stop-color="#d8ebe0"/></linearGradient></defs></svg>
