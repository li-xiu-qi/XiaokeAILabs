engine:
  type: openai
  model_name: ${MINICPM_OCR_HOME:-$MINICPM_OCR_HOME}/models/MiniCPM-OCR-1.0
  server_url: http://127.0.0.1:18499
  request_timeout_sec: 600
  extra_body:
    generation_config: '{"top_k": 1, "repetition_penalty": 1.0, "no_repeat_ngram_size": 100}'

layout:
  enabled: true
  provider: ppdoclayout3_torch
  model_dir: ${MINICPM_OCR_HOME:-$MINICPM_OCR_HOME}/models/PP-DocLayoutV3
  device: cuda
  threshold: 0.3
  nms: true

pipeline:
  max_workers: 8
  page_workers: 1
  layout_workers: 1

decode:
  temperature: 0.01
  top_p: 0.001
