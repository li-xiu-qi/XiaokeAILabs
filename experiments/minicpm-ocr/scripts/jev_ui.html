<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR 质检 · MiniCPM-OCR</title>
<style>
  /* 设计意图：内部工具，Mode = Operate。
     唯一职责：判断一段 OCR 文本是否忠实还原了原图。
     三旋钮 VARIANCE 3 / MOTION 2 / DENSITY 6。
     签名点：结果里原图与渲染图并排同尺度，让人看见分数从哪来。 */
  :root {
    --bg: #F6F5F1;
    --panel: #FFFFFF;
    --ink: #1B1A17;
    --ink2: #63605A;
    --line: #E3E0D8;
    --line2: #CFCBC0;
    --accent: #9A4A22;
    --ok: #2C6A4E;
    --ok-bg: #EDF4EF;
    --bad: #A33A2A;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    --r: 10px;
    --fast: 150ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.6 var(--sans);
    padding: 32px 24px 72px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header { margin-bottom: 24px; }
  h1 { font-size: 19px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { margin: 0; color: var(--ink2); max-width: 640px; }

  .cols { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 20px;
  }
  .panel + .panel { margin-top: 24px; }
  h2 {
    font-size: 12px; font-weight: 650; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink2);
    margin: 0 0 16px; display: flex; align-items: center; gap: 8px;
  }
  h2 .n {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--line2);
    font-size: 11px; color: var(--ink2); letter-spacing: 0;
  }

  /* 图区 */
  .dropzone {
    border: 1px dashed var(--line2);
    border-radius: var(--r);
    min-height: 148px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 20px; cursor: pointer;
    color: var(--ink2); background: #FCFBF9;
    transition: border-color var(--fast), background var(--fast);
  }
  .dropzone:hover, .dropzone:focus-visible, .dropzone.over {
    border-color: var(--accent); background: #FFFDFB; outline: none;
  }
  .dropzone strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  .dropzone span { font-size: 12.5px; }
  .dropzone.compact { min-height: 72px; padding: 12px; }
  #preview { margin-top: 16px; display: none; }
  #preview.on { display: block; }
  #preview img {
    width: 100%; max-height: 260px; object-fit: contain;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; display: block;
  }
  .imgmeta { color: var(--ink2); font-size: 12px; margin-top: 6px; font-family: var(--mono); }

  .field { margin-top: 16px; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  select {
    width: 100%; font: inherit; color: inherit; background: #fff;
    border: 1px solid var(--line2); border-radius: 8px; padding: 10px 12px; min-height: 44px;
  }

  /* 按钮 */
  .btn {
    font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
    min-height: 44px; padding: 0 18px;
    transition: background var(--fast), border-color var(--fast), color var(--fast);
  }
  .btn.primary { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
  .btn.primary:hover:not(:disabled) { background: #000; }
  .btn.primary:disabled { background: #B9B5AC; border-color: #B9B5AC; cursor: default; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line2); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--ink2); }
  .btn.ghost:disabled { color: #B9B5AC; cursor: default; }
  .btn.block { width: 100%; margin-top: 16px; }
  .btn.tiny {
    min-height: 28px; padding: 0 10px; font-size: 12px; font-weight: 500;
    background: transparent; border: 1px solid transparent; color: var(--ink2);
  }
  .btn.tiny:hover { color: var(--bad); border-color: var(--line2); }

  /* 候选列表 */
  .cand { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #FCFBF9; }
  .cand + .cand { margin-top: 12px; }
  .cand-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cand-idx { font-size: 12px; color: var(--ink2); font-weight: 600; }
  .cand textarea {
    width: 100%; min-height: 104px; resize: vertical;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
  }
  .cand textarea:focus { outline: 2px solid rgba(154, 74, 34, 0.25); border-color: var(--accent); }
  .cand-foot { display: flex; justify-content: space-between; margin-top: 6px; color: var(--ink2); font-size: 11.5px; }
  .actionbar { display: flex; align-items: center; gap: 16px; margin-top: 20px; }
  #status { color: var(--ink2); font-size: 13px; min-height: 20px; }
  #status.err { color: var(--bad); }

  /* 结果 */
  #results[hidden] { display: none; }
  .res {
    display: grid; grid-template-columns: 132px 132px minmax(0, 1fr);
    gap: 20px; align-items: start;
    border: 1px solid var(--line); border-radius: var(--r);
    padding: 16px; background: var(--panel);
    animation: enter var(--fast) both;
  }
  .res + .res { margin-top: 12px; }
  .res.best { border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
  @keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .res { animation: none; } }

  figure { margin: 0; }
  figure img {
    width: 100%; height: 132px; object-fit: contain;
    background: #fff; border: 1px solid var(--line); border-radius: 6px;
    cursor: zoom-in; display: block;
  }
  figcaption { font-size: 11px; color: var(--ink2); margin-top: 4px; text-align: center; }

  .scoreline { display: flex; align-items: baseline; gap: 10px; }
  .score { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .res.best .score { color: var(--ok); }
  .tag {
    font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--ok-bg); color: var(--ok);
  }
  .tag.muted { background: var(--bg); color: var(--ink2); font-weight: 500; }
  .tag.bad { background: #FBEDEA; color: var(--bad); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 0 12px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .res.best .bar > i { background: var(--ok); }
  .res-text {
    font-family: var(--mono); font-size: 12px; line-height: 1.6; color: #45423C;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; max-height: 132px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  @media (max-width: 820px) {
    .res { grid-template-columns: 1fr 1fr; }
    .res-body { grid-column: 1 / -1; }
  }
  .stage { margin-top: 12px; color: var(--ink2); font-size: 12px; font-family: var(--mono); }
  .stage span + span::before { content: "·"; margin: 0 8px; color: var(--line2); }

  dialog {
    border: 0; padding: 0; background: transparent; max-width: 92vw; max-height: 92vh;
  }
  dialog::backdrop { background: rgba(27, 26, 23, 0.72); }
  dialog img { max-width: 92vw; max-height: 84vh; display: block; border-radius: 8px; background: #fff; }
  dialog .close {
    margin: 12px auto 0; display: block; background: #fff; color: var(--ink);
    border: 1px solid var(--line2); border-radius: 8px; padding: 8px 18px;
    font: inherit; font-weight: 600; cursor: pointer; min-height: 40px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OCR 质检</h1>
    <p class="lede">
      判断一段 OCR 文本是否忠实还原了原图内容。分数 0 到 1，越大越一致；它不改写文本，只给判定。
      识别由 MiniCPM-OCR 1.0 完成，质检由 Jev 完成，是两个模型。
    </p>
  </header>

  <div class="cols">
    <section class="panel">
      <h2><span class="n">1</span>原图</h2>
      <div id="drop" class="dropzone" role="button" tabindex="0"
           title="点击选择图片，或把图片拖到这里。请用法版面裁切后的单块图片">
        <div>
          <strong>点击选择，或拖入图片</strong>
          <span>请用版面裁切后的单块图，整页不适配</span>
        </div>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <div id="preview">
        <img id="previewImg" alt="原图预览">
        <div class="imgmeta" id="imgMeta"></div>
      </div>

      <div class="field">
        <label for="cat">内容类型</label>
        <select id="cat" title="决定识别时的指令，也决定质检时按哪种版式渲染">
          <option value="text">正文段落</option>
          <option value="formula">数学公式</option>
          <option value="table">表格</option>
        </select>
      </div>

      <button id="ocrBtn" class="btn ghost block" disabled
              title="调用 OCR 模型识别这张图，结果写入候选 1">识别这张图</button>
    </section>

    <section class="panel">
      <h2><span class="n">2</span>待检文本</h2>
      <div id="candList"></div>
      <button id="addCand" class="btn ghost block" style="margin-top:12px"
              title="再加一条候选文本，用于和现有的比较高低">添加一条候选</button>

      <div class="actionbar">
        <button id="go" class="btn primary" disabled
                title="把每条候选渲染成图片，与原图一起交给质检模型打分">开始打分</button>
        <span id="status">先选一张图</span>
      </div>
    </section>
  </div>

  <section class="panel" id="results" hidden>
    <h2><span class="n">3</span>结果</h2>
    <div id="resList"></div>
  </section>
</div>

<dialog id="zoom">
  <img id="zoomImg" alt="放大查看">
  <button class="close" title="关闭放大图">关闭</button>
</dialog>

<script>
const el = (s) => document.querySelector(s);
const state = { b64: null, url: null, cands: [''], busy: false };

const dropEl = el('#drop'), fileEl = el('#file'), previewEl = el('#preview');
const previewImg = el('#previewImg'), imgMeta = el('#imgMeta');
const catEl = el('#cat'), candListEl = el('#candList');
const ocrBtn = el('#ocrBtn'), goBtn = el('#go'), addBtn = el('#addCand');
const statusEl = el('#status'), resultsEl = el('#results'), resListEl = el('#resList');
const zoomEl = el('#zoom'), zoomImg = el('#zoomImg');

function say(text, isErr) {
  statusEl.textContent = text;
  statusEl.classList.toggle('err', !!isErr);
}

function refreshButtons() {
  const hasImg = !!state.b64;
  const hasText = state.cands.some((c) => c.trim());
  ocrBtn.disabled = !hasImg || state.busy;
  goBtn.disabled = !hasImg || !hasText || state.busy;
  addBtn.disabled = state.busy;
}

function renderCands() {
  candListEl.innerHTML = '';
  state.cands.forEach((text, i) => {
    const box = document.createElement('div');
    box.className = 'cand';
    const head = document.createElement('div');
    head.className = 'cand-head';
    const idx = document.createElement('span');
    idx.className = 'cand-idx';
    idx.textContent = '候选 ' + (i + 1) + (i === 0 ? '（主候选）' : '');
    const rm = document.createElement('button');
    rm.className = 'btn tiny';
    rm.textContent = '删除';
    rm.title = '删除这条候选';
    rm.disabled = state.cands.length === 1;
    rm.onclick = () => { state.cands.splice(i, 1); if (!state.cands.length) state.cands = ['']; renderCands(); refreshButtons(); };
    head.append(idx, rm);

    const ta = document.createElement('textarea');
    ta.value = text;
    ta.placeholder = i === 0 ? '粘贴或识别 OCR 结果' : '粘贴另一条候选，用于比较';
    ta.title = '这段文本会被渲染成图片，再和原图一起送进质检模型';
    ta.oninput = () => { state.cands[i] = ta.value; refreshButtons(); updateCount(box, ta.value); };

    const foot = document.createElement('div');
    foot.className = 'cand-foot';
    const count = document.createElement('span');

    box.append(head, ta, foot);
    foot.appendChild(count);
    updateCount(box, text);
    candListEl.appendChild(box);
  });
}

function updateCount(box, text) {
  const c = box.querySelector('.cand-foot span');
  if (c) c.textContent = text.length + ' 字符 · ' + (text.trim() ? text.trim().split('\n').length + ' 行' : '空');
}

function setImage(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { say('这不是图片文件', true); return; }
  const reader = new FileReader();
  reader.onload = () => {
    state.url = reader.result;
    state.b64 = String(reader.result).split(',')[1];
    previewImg.src = state.url;
    previewEl.classList.add('on');
    dropEl.classList.add('compact');
    dropEl.innerHTML = '<div><strong>换一张图</strong><span>点击或拖入替换</span></div>';
    const img = new Image();
    img.onload = () => { imgMeta.textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' px · ' + Math.round(file.size / 1024) + ' KB'; };
    img.src = state.url;
    say('已就绪，可以识别或直接粘贴文本打分');
    refreshButtons();
  };
  reader.readAsDataURL(file);
}

dropEl.onclick = () => fileEl.click();
dropEl.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileEl.click(); } };
fileEl.onchange = () => setImage(fileEl.files[0]);
['dragenter', 'dragover'].forEach((ev) => dropEl.addEventListener(ev, (e) => {
  e.preventDefault(); dropEl.classList.add('over');
}));
['dragleave', 'drop'].forEach((ev) => dropEl.addEventListener(ev, (e) => {
  e.preventDefault(); dropEl.classList.remove('over');
}));
dropEl.addEventListener('drop', (e) => setImage(e.dataTransfer.files[0]));

addBtn.onclick = () => { state.cands.push(''); renderCands(); refreshButtons(); };

async function doOcr() {
  if (!state.b64) return;
  state.busy = true; refreshButtons();
  say('正在识别，通常 1 到 4 秒');
  try {
    const resp = await fetch('/ui/ocr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: state.b64, category: catEl.value }),
    });
    if (!resp.ok) throw new Error((await resp.text()).slice(0, 300));
    const body = await resp.json();
    const text = body.text || '';
    const firstEmpty = state.cands.findIndex((c) => !c.trim());
    if (firstEmpty === -1) state.cands.push(text); else state.cands[firstEmpty] = text;
    renderCands();
    say('识别完成，用时 ' + body.seconds + ' 秒。核对无误后点开始打分');
  } catch (err) {
    say('识别失败：' + (err.message || err), true);
  } finally {
    state.busy = false; refreshButtons();
  }
}

async function doScore() {
  const texts = state.cands.map((c) => c.replace(/\s+$/, '')).filter((c) => c.trim());
  if (!state.b64 || !texts.length) return;
  state.busy = true; refreshButtons(); resultsEl.hidden = true;
  say('正在渲染并打分，首次调用要拉起浏览器，约 3 秒');
  const t0 = performance.now();
  try {
    const resp = await fetch('/ui/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input_form: 'binary', image: state.b64, candidates: texts, category: catEl.value }),
    });
    if (!resp.ok) throw new Error((await resp.text()).slice(0, 300));
    const body = await resp.json();
    renderResults(body, texts);
    say('完成，用时 ' + ((performance.now() - t0) / 1000).toFixed(2) + ' 秒');
  } catch (err) {
    say('打分失败：' + (err.message || err), true);
  } finally {
    state.busy = false; refreshButtons();
  }
}

function renderResults(body, texts) {
  resListEl.innerHTML = '';
  body.scores.forEach((score, i) => {
    const isBest = i === body.best_index;
    const card = document.createElement('article');
    card.className = 'res' + (isBest ? ' best' : '');

    const f1 = document.createElement('figure');
    const i1 = document.createElement('img');
    i1.src = state.url; i1.alt = '原图'; i1.title = '点击放大原图';
    i1.onclick = () => openZoom(state.url);
    const c1 = document.createElement('figcaption'); c1.textContent = '原图';
    f1.append(i1, c1);

    const f2 = document.createElement('figure');
    const i2 = document.createElement('img');
    const renderB64 = body.renders ? body.renders[i] : null;
    if (renderB64) {
      i2.src = 'data:image/png;base64,' + renderB64;
      i2.alt = '渲染结果';
      i2.title = '这段文本被渲染成的样子，点击放大';
      i2.onclick = () => openZoom(i2.src);
    } else {
      i2.alt = '渲染失败';
      i2.style.cursor = 'default';
      i2.style.background = '#FAF8F5';
    }
    const c2 = document.createElement('figcaption');
    c2.textContent = renderB64 ? '渲染结果' : '渲染失败';
    f2.append(i2, c2);

    const bodyEl = document.createElement('div');
    bodyEl.className = 'res-body';
    const verdict = body.verdicts[i];
    const isOk = verdict === 'scored' && (isBest || score >= 0.5);
    const tagText = verdict !== 'scored' ? '未能打分' : (isBest ? '判为最一致' : (score >= 0.5 ? '判为一致' : '判为不一致'));
    const tagClass = verdict !== 'scored' ? ' muted' : (isOk ? '' : ' bad');
    bodyEl.innerHTML =
      '<div class="scoreline">' +
        '<span class="score">' + score.toFixed(3) + '</span>' +
        '<span class="tag' + tagClass + '">' + tagText + '</span>' +
      '</div>' +
      '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, score * 100)).toFixed(1) + '%"></i></div>' +
      '<div class="res-text"></div>';
    bodyEl.querySelector('.res-text').textContent = texts[i];

    card.append(f1, f2, bodyEl);
    resListEl.appendChild(card);
  });

  if (body.stage_sec) {
    const st = document.createElement('div');
    st.className = 'stage';
    const labels = { render_sec: '渲染', forward_sec: '打分' };
    st.innerHTML = Object.entries(body.stage_sec)
      .filter(([k]) => labels[k])
      .map(([k, v]) => '<span>' + labels[k] + ' ' + v + ' 秒</span>').join('');
    resListEl.appendChild(st);
  }
  resultsEl.hidden = false;
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function openZoom(src) {
  zoomImg.src = src;
  if (typeof zoomEl.showModal === 'function') zoomEl.showModal();
}
zoomEl.querySelector('.close').onclick = () => zoomEl.close();
zoomEl.onclick = (e) => { if (e.target === zoomEl) zoomEl.close(); };

ocrBtn.onclick = doOcr;
goBtn.onclick = doScore;
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); if (!goBtn.disabled) doScore(); }
});

renderCands();
refreshButtons();
</script>
</body>
</html>
