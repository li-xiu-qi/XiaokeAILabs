<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">KV cache: prefill and incremental decoding</title><desc id="desc">Prompt tokens fill the cache, then each new token reuses and extends the cache to produce next-token logits.</desc>
  <rect width="1000" height="280" rx="22" fill="#101c1a"/><text x="40" y="47" fill="#e7f2e9" font-family="sans-serif" font-size="24" font-weight="700">KV CACHE / AUTOREGRESSIVE DECODING</text><text x="40" y="74" fill="#9eb7a9" font-family="sans-serif" font-size="14">Reuse historical keys and values while the context grows</text>
  <rect x="40" y="103" width="220" height="112" rx="14" fill="#203a33" stroke="#477969"/><text x="60" y="137" fill="#9be2ba" font-family="sans-serif" font-size="13" font-weight="700">01  PREFILL</text><text x="60" y="166" fill="#f0f7f1" font-family="sans-serif" font-size="18">Full prompt tokens</text><text x="60" y="193" fill="#a8c1b1" font-family="sans-serif" font-size="13">Compute initial K / V</text>
  <path d="M260 159H310" stroke="#80c9a3" stroke-width="3"/><path d="M303 152l9 7-9 7" fill="none" stroke="#80c9a3" stroke-width="3"/>
  <rect x="315" y="103" width="245" height="112" rx="14" fill="#245045" stroke="#70b594"/><text x="335" y="137" fill="#b7efd0" font-family="sans-serif" font-size="13" font-weight="700">02  CACHE PER LAYER</text><text x="335" y="166" fill="#fff" font-family="sans-serif" font-size="18">Historical K + V</text><text x="335" y="193" fill="#bee0cb" font-family="sans-serif" font-size="13">Retain and extend with each step</text>
  <path d="M560 159H610" stroke="#80c9a3" stroke-width="3"/><path d="M603 152l9 7-9 7" fill="none" stroke="#80c9a3" stroke-width="3"/>
  <rect x="615" y="103" width="345" height="112" rx="14" fill="#26362f" stroke="#7b9472"/><text x="635" y="137" fill="#d4e8a3" font-family="sans-serif" font-size="13" font-weight="700">03  DECODE</text><text x="635" y="166" fill="#f4f8eb" font-family="sans-serif" font-size="18">New token + cache → logits</text><text x="635" y="193" fill="#c2d0b4" font-family="sans-serif" font-size="13">Attention still reads the context</text>
  <text x="40" y="254" fill="#829c8c" font-family="sans-serif" font-size="12">Conceptual flow · not a latency measurement</text>
</svg>
