<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">Four vector search routes</title><desc id="desc">Flat scans all points; IVF searches selected clusters; HNSW follows graph links; PQ compares compressed codes.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10222a"/><stop offset="1" stop-color="#0b161d"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#d6ede6" stroke-width="1.3"/></marker></defs>
<rect width="1440" height="720" rx="28" fill="url(#bg)"/><text x="64" y="76" fill="#e4f3ee" font-family="sans-serif" font-size="31" font-weight="700">VECTOR SEARCH / FOUR ROUTES</text><text x="64" y="114" fill="#9dbab3" font-family="sans-serif" font-size="19">One query · different routes through the same collection</text>
<g font-family="sans-serif"><g transform="translate(64 160)"><rect width="305" height="455" rx="20" fill="#18343a"/><text x="24" y="42" fill="#99e3ce" font-size="23" font-weight="700">01  FLAT</text><text x="24" y="77" fill="#d9ebe5" font-size="16">Compare every vector</text><g fill="#83bdb0"><circle cx="64" cy="160" r="8"/><circle cx="128" cy="160" r="8"/><circle cx="192" cy="160" r="8"/><circle cx="256" cy="160" r="8"/><circle cx="64" cy="215" r="8"/><circle cx="128" cy="215" r="8"/><circle cx="192" cy="215" r="8"/><circle cx="256" cy="215" r="8"/><circle cx="64" cy="270" r="8"/><circle cx="128" cy="270" r="8"/><circle cx="192" cy="270" r="8"/><circle cx="256" cy="270" r="8"/></g><path d="M28 320h245" stroke="#527e75"/><text x="24" y="363" fill="#e6f3ed" font-size="17">Exact neighbors</text><text x="24" y="392" fill="#aac3bb" font-size="15">Work grows with N × d</text></g>
<g transform="translate(400 160)"><rect width="305" height="455" rx="20" fill="#1b3b3a"/><text x="24" y="42" fill="#99e3ce" font-size="23" font-weight="700">02  IVF</text><text x="24" y="77" fill="#d9ebe5" font-size="16">Route to selected clusters</text><g fill="none" stroke="#5a887b" stroke-width="2"><ellipse cx="84" cy="188" rx="58" ry="54"/><ellipse cx="218" cy="188" rx="58" ry="54"/><ellipse cx="151" cy="267" rx="58" ry="42"/></g><g fill="#83bdb0"><circle cx="64" cy="171" r="5"/><circle cx="94" cy="200" r="5"/><circle cx="112" cy="172" r="5"/><circle cx="201" cy="174" r="5"/><circle cx="233" cy="197" r="5"/><circle cx="211" cy="214" r="5"/><circle cx="124" cy="265" r="5"/><circle cx="150" cy="280" r="5"/><circle cx="175" cy="262" r="5"/></g><path d="M148 104L92 144" stroke="#d6ede6" stroke-width="2" marker-end="url(#arrow)"/><path d="M28 320h245" stroke="#527e75"/><text x="24" y="363" fill="#e6f3ed" font-size="17">nprobe selects lists</text><text x="24" y="392" fill="#aac3bb" font-size="15">Missed lists hide candidates</text></g>
<g transform="translate(736 160)"><rect width="305" height="455" rx="20" fill="#303c3d"/><text x="24" y="42" fill="#efd389" font-size="23" font-weight="700">03  HNSW</text><text x="24" y="77" fill="#e8e9da" font-size="16">Explore a neighbor graph</text><g stroke="#9aa997" stroke-width="2" fill="none"><path d="M51 207L116 155L173 198L250 148M51 207L97 266L173 198L224 272M97 266L224 272M116 155L250 148"/></g><g fill="#efd389"><circle cx="51" cy="207" r="8"/><circle cx="116" cy="155" r="8"/><circle cx="173" cy="198" r="10"/><circle cx="250" cy="148" r="8"/><circle cx="97" cy="266" r="8"/><circle cx="224" cy="272" r="8"/></g><path d="M28 320h245" stroke="#77857b"/><text x="24" y="363" fill="#edf0e5" font-size="17">efSearch widens exploration</text><text x="24" y="392" fill="#bfcbbd" font-size="15">Edges add memory overhead</text></g>
<g transform="translate(1072 160)"><rect width="305" height="455" rx="20" fill="#3c3c35"/><text x="24" y="42" fill="#efd389" font-size="23" font-weight="700">04  PQ</text><text x="24" y="77" fill="#e8e9da" font-size="16">Compare compact codes</text><g font-family="monospace" font-size="19" text-anchor="middle"><rect x="34" y="155" width="237" height="57" rx="8" fill="#506359"/><text x="153" y="191" fill="#f5f3dd">float vector</text><path d="M152 218v27" stroke="#d6ede6" marker-end="url(#arrow)"/><rect x="34" y="257" width="48" height="45" rx="6" fill="#d0ad65"/><rect x="97" y="257" width="48" height="45" rx="6" fill="#d0ad65"/><rect x="160" y="257" width="48" height="45" rx="6" fill="#d0ad65"/><rect x="223" y="257" width="48" height="45" rx="6" fill="#d0ad65"/><text x="58" y="287" fill="#1c302e">3</text><text x="121" y="287" fill="#1c302e">9</text><text x="184" y="287" fill="#1c302e">1</text><text x="247" y="287" fill="#1c302e">7</text></g><path d="M28 320h245" stroke="#918f78"/><text x="24" y="363" fill="#f1efdf" font-size="17">Smaller representation</text><text x="24" y="392" fill="#d1cdb7" font-size="15">Quantization can change rank</text></g></g><text x="64" y="668" fill="#88a9a0" font-family="sans-serif" font-size="15">ILLUSTRATIVE ROUTES  /  IVF AND PQ CAN BE COMBINED</text></svg>
