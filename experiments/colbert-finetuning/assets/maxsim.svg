<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">ColBERT 的 token 级匹配</title><desc id="desc">查询与文档分别编码后，查询中的每个 token 寻找文档中相似度最高的 token，汇总得到文档分数。</desc><rect width="800" height="300" rx="24" fill="#10241f"/><text x="34" y="42" fill="#9bc5a7" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" letter-spacing="2">COLBERT · LATE INTERACTION</text><text x="34" y="78" fill="#f6f3e8" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="700">每个查询词，都能找到自己的匹配</text><text x="34" y="125" fill="#c5dcca" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16">查询 tokens</text><text x="34" y="220" fill="#c5dcca" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16">文档 tokens</text><g fill="#c0dfc5"><rect x="165" y="101" width="96" height="38" rx="8"/><rect x="285" y="101" width="96" height="38" rx="8"/><rect x="405" y="101" width="96" height="38" rx="8"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle" fill="#17392e" font-size="15"><text x="213" y="125">q₁</text><text x="333" y="125">q₂</text><text x="453" y="125">q₃</text></g><g stroke="#88b998" stroke-width="2" fill="none"><path d="M213 140 L265 194"/><path d="M333 140 L384 194"/><path d="M453 140 L505 194"/></g><g fill="#f1efe3"><rect x="165" y="194" width="80" height="38" rx="8"/><rect x="255" y="194" width="80" height="38" rx="8"/><rect x="345" y="194" width="80" height="38" rx="8"/><rect x="435" y="194" width="80" height="38" rx="8"/><rect x="525" y="194" width="80" height="38" rx="8"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle" fill="#17392e" font-size="15"><text x="205" y="218">d₁</text><text x="295" y="218">d₂</text><text x="385" y="218">d₃</text><text x="475" y="218">d₄</text><text x="565" y="218">d₅</text></g><rect x="625" y="144" width="140" height="62" rx="12" fill="#356f56"/><text x="695" y="171" text-anchor="middle" fill="#fffdf1" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" font-weight="700">取最大值</text><text x="695" y="193" text-anchor="middle" fill="#d4ebd8" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14">再汇总分数</text><text x="34" y="272" fill="#a8cbb2" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14">示意图：连线代表每个查询 token 的最高相似度匹配。</text></svg>
