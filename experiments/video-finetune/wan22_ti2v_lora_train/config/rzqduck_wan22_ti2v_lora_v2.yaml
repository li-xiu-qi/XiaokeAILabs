---
job: extension
config:
  name: "rzqduck_wan22_ti2v_lora_v2"
  process:
    - type: 'sd_trainer'
      training_folder: "output_v2"
      device: cuda:0
      # 第二轮（修正轮）：DGX Spark 121GB 统一内存，Wan2.2-TI2V-5B bf16 全精度 + LoRA
      # 相对第一轮的修正：
      #   1. caption 极简化（"rzqduck, <motion>"），去掉显式外观描述，逼 token 承载概念
      #   2. 场景去偏：18 段 clip，水景/非水景各半（第一轮 12 段里 7 段水景）
      #   3. 步数 300 → 400
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 100
        max_step_saves_to_keep: 4
        push_to_hub: false
      datasets:
        - folder_path: "/home/ke/XiaokeAILabs/experiments/video-finetune/wan22_ti2v_lora_train/data/rzqduck_clips_v2"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          num_frames: 49
          fps: 24
          resolution: [ 512 ]
      train:
        batch_size: 1
        steps: 400
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        cache_text_embeddings: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "/home/ke/models/Wan2.2-TI2V-5B-Diffusers"
        arch: 'wan22_5b'
        quantize: false
        quantize_te: false
      sample:
        sampler: "flowmatch"
        sample_every: 200
        sample_start_step: 0
        width: 512
        height: 512
        num_frames: 49
        fps: 24
        prompts:
          # 与第一轮相同的四个未见场景，caption 格式对齐训练集（token 打头）
          - "rzqduck sitting on a sunny windowsill next to a potted plant"
          - "rzqduck floating on a moonlit pond surrounded by fireflies"
          - "rzqduck riding a paper boat down a rainy street stream"
          - "rzqduck on a kitchen counter with rising steam from a pot"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 5.0
        sample_steps: 20
meta:
  name: "[name]"
  version: '1.0'
