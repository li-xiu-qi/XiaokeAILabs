<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="Eight concurrent requests: eight slots increase aggregate throughput from 74.8 to 114.0 tokens per second while median request completion increases from 7.79 to 8.78 seconds.">
<rect width="920" height="360" fill="#f8fafc"/><text x="36" y="43" font-family="sans-serif" font-size="23" font-weight="bold" fill="#18283b">8 concurrent requests: throughput and latency</text><text x="36" y="70" font-family="sans-serif" font-size="15" fill="#526579">Qwen3.6-35B-A3B · DGX Spark · 128 output tokens · mean of 2 rounds</text>
<text x="36" y="120" font-family="sans-serif" font-size="17" font-weight="bold" fill="#18283b">Aggregate output (tokens/s)</text><rect x="36" y="139" width="267" height="29" rx="5" fill="#8296ad"/><rect x="36" y="181" width="407" height="29" rx="5" fill="#137c83"/><text x="316" y="160" font-family="sans-serif" font-size="17" fill="#18283b">1 slot: 74.8</text><text x="456" y="202" font-family="sans-serif" font-size="17" fill="#18283b">8 slots: 114.0 (+52%)</text>
<text x="36" y="258" font-family="sans-serif" font-size="16" fill="#18283b">Median request completion: 1 slot 7.79 s  |  8 slots 8.78 s</text><text x="36" y="292" font-family="sans-serif" font-size="14" fill="#526579">Higher throughput does not imply lower latency for every request.</text><text x="36" y="318" font-family="sans-serif" font-size="13" fill="#526579">Small sample; short requests; existing services remained running.</text>
</svg>
