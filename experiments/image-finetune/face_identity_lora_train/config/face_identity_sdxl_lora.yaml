---
job: extension
config:
  name: "face_identity_sdxl_lora"
  process:
    - type: 'sd_trainer'
      training_folder: "output_face"
      device: cuda:0
      # 单人身份 LoRA（DreamBooth 式）。目标：证明微调能让底模生成一个
      # 它本来生成不出来的特定人脸。
      #
      # 数据：CelebA celeb_id=14，20 张训练 / 10 张测试（测试集不进训练，
      # 只用于人脸相似度评估）。交替切分，保证训练/测试的光线与角度都有覆盖。
      #
      # 基线已测：底模用中性提示词生成，与该人的 ArcFace 相似度 -0.017，
      # 与陌生人 0.025，而同一人的跨集相似度是 0.716。靶子成立。
      #
      # 与国芳实验的差异：
      #   - 分辨率降到 512（原图仅 178x218，1024 是纯上采样，只会教噪声）
      #   - caption 用 "vkqzm, a photo of a man"，trigger 复用已有词元
      #   - 20 张 x 100 epoch = 2000 步，单人身份比风格更吃步数
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
        dropout: 0.05
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 4
        push_to_hub: false
      datasets:
        - folder_path: "/home/ke/face_train"
          caption_ext: "txt"
          caption_dropout_rate: 0.0
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512 ]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: false
        noise_scheduler: "ddpm"
        optimizer: "adamw"
        lr: 1e-4
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "/home/ke/models/SDXL-base-vkqzm"
        is_xl: true
        is_v2: false
        quantize: false
      sample:
        sampler: "dpmsolver++"
        sample_every: 500
        sample_start_step: 0
        width: 512
        height: 512
        prompts:
          - "vkqzm, a photo of a man"
          - "vkqzm, a photo of a man smiling"
          - "vkqzm, a man wearing a black jacket"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 7
        sample_steps: 25
meta:
  name: "[name]"
  version: '1.0'
