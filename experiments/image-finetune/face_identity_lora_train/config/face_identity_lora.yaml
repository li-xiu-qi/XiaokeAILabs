---
job: extension
config:
  name: "face_identity_lora"
  process:
    - type: 'sd_trainer'
      training_folder: "output/face_identity_lora"
      device: cuda:0
      # Single-identity LoRA (DreamBooth style). Goal: show that fine-tuning makes
      # the base model produce a specific face it otherwise cannot.
      #
      # Data: CelebA celeb_id=14, 20 train / 10 test. The test split never enters
      # training; it exists only to measure face similarity.
      #
      # Why these settings:
      #   - 512 px: the source images are 178x218, so 1024 would teach upsampling blur
      #   - 2000 steps at 20 images = 100 epochs; a single identity needs more steps
      #     than a style does
      #   - lr 1e-4 with no caption dropout; see face_identity_lora_v2.yaml for the
      #     lower-lr variant that was tried to fight overfitting
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
        dropout: 0.05
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 4
        push_to_hub: false
      datasets:
        # Relative to this file's parent directory; override with a symlink or by
        # pointing folder_path at $FACE_DATA_DIR/celeb_14/train directly.
        - folder_path: "../data/celeb_14/train"
          caption_ext: "txt"
          caption_dropout_rate: 0.0
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512 ]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: false
        noise_scheduler: "ddpm"
        optimizer: "adamw"
        lr: 1e-4
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        # Replace with any SDXL base checkpoint, local or a HF repo id.
        name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
        is_xl: true
        is_v2: false
        quantize: false
      sample:
        sampler: "dpmsolver++"
        sample_every: 500
        sample_start_step: 0
        width: 512
        height: 512
        prompts:
          - "vkqzm, a photo of a person"
          - "vkqzm, a photo of a person smiling"
          - "vkqzm, a person wearing a black jacket"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 7
        sample_steps: 25
meta:
  name: "[name]"
  version: '1.0'
