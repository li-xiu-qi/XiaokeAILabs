---
job: extension
config:
  name: "face_identity_lora_regularized"
  process:
    - type: 'sd_trainer'
      training_folder: "output/face_identity_lora_regularized"
      device: cuda:0
      # Second run: same data, three changes aimed at the overfitting seen after
      # step 1000 in the first run. All three reduce how hard the LoRA memorises.
      #
      #   steps 2000 -> 800          stop before the decline, rather than after it
      #   lr 1e-4 -> 5e-5            smaller steps, less memorisation per image
      #   caption dropout 0 -> 0.15  force the model to rely on the trigger token
      #                              less, which trades identity for prompt control
      #
      # Result: 0.2623 vs 0.3232, both scanned at 512px. Lower, not higher — the
      # ceiling is the source resolution, not the training schedule. Kept as a
      # documented negative result.
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
        dropout: 0.05
      save:
        dtype: float16
        save_every: 200
        max_step_saves_to_keep: 4
        push_to_hub: false
      datasets:
        - folder_path: "../data/celeb_14/train"
          caption_ext: "txt"
          caption_dropout_rate: 0.15
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512 ]
      train:
        batch_size: 1
        steps: 800
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: false
        noise_scheduler: "ddpm"
        optimizer: "adamw"
        lr: 5e-5
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
        is_xl: true
        is_v2: false
        quantize: false
      sample:
        sampler: "dpmsolver++"
        sample_every: 200
        sample_start_step: 0
        width: 512
        height: 512
        prompts:
          - "vkqzm, a photo of a person"
          - "vkqzm, a photo of a person smiling"
          - "vkqzm, a person wearing a black jacket"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 7
        sample_steps: 25
meta:
  name: "[name]"
  version: '1.0'
