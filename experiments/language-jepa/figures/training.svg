<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="t"><title id="t">LLM generation and JEPA representation objectives</title><rect width="1100" height="310" rx="24" fill="#11232c"/><text x="42" y="53" fill="#e8f2ec" font-family="sans-serif" font-size="26" font-weight="700">ONE MODEL · TWO TRAINING OBJECTIVES</text><g font-family="sans-serif" font-size="19"><rect x="42" y="95" width="210" height="150" rx="16" fill="#234651"/><text x="67" y="142" fill="#8fd6b5">INPUT PAIR</text><text x="67" y="179" fill="white">Question</text><text x="67" y="213" fill="white">Answer</text><path d="M260 171h45" stroke="#78ceb1" stroke-width="3"/><rect x="315" y="95" width="245" height="150" rx="16" fill="#234651"/><text x="339" y="142" fill="#8fd6b5">SHARED LLM</text><text x="339" y="179" fill="white">Token predictions</text><text x="339" y="213" fill="white">Hidden states</text><path d="M570 171h45" stroke="#78ceb1" stroke-width="3"/><rect x="625" y="95" width="430" height="150" rx="16" fill="#25493f"/><text x="649" y="142" fill="#9de0bc">TRAINING LOSS</text><text x="649" y="179" fill="white">Answer cross-entropy</text><text x="649" y="213" fill="white">+ 0.1 × representation distance</text></g><text x="42" y="284" fill="#a2b7b6" font-family="sans-serif" font-size="14">At inference: prompt → generated answer; JEPA loss is not computed.</text></svg>
