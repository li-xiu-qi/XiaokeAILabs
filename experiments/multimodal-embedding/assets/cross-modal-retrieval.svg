<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Cross-modal retrieval</title>
  <desc id="desc">Text and image encoders map inputs into vectors. A similarity search returns ranked candidate images.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b25"/><stop offset="1" stop-color="#172e35"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74ddbe"/></marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" fill="#d9f3e9" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">CROSS-MODAL RETRIEVAL</text>
  <text x="48" y="93" fill="#f5faf8" font-family="Arial,sans-serif" font-size="26" font-weight="700">One space, multiple ways to search</text>
  <rect x="48" y="132" width="198" height="101" rx="14" fill="#263b42" stroke="#4c6b6b"/>
  <text x="70" y="163" fill="#a8c4bd" font-family="Arial,sans-serif" font-size="13" letter-spacing="1">QUERY</text>
  <text x="70" y="196" fill="#fff" font-family="Arial,sans-serif" font-size="21">Text</text>
  <rect x="48" y="261" width="198" height="101" rx="14" fill="#263b42" stroke="#4c6b6b"/>
  <text x="70" y="292" fill="#a8c4bd" font-family="Arial,sans-serif" font-size="13" letter-spacing="1">CANDIDATES</text>
  <text x="70" y="325" fill="#fff" font-family="Arial,sans-serif" font-size="21">Images</text>
  <path d="M247 183H293M247 312H293" stroke="#74ddbe" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="132" width="200" height="101" rx="14" fill="#1d4546" stroke="#61a897"/>
  <text x="321" y="175" fill="#e5fff3" font-family="Arial,sans-serif" font-size="20">Text encoder</text><text x="321" y="205" fill="#9ac8b8" font-family="Arial,sans-serif" font-size="13">encode query</text>
  <rect x="300" y="261" width="200" height="101" rx="14" fill="#1d4546" stroke="#61a897"/>
  <text x="321" y="304" fill="#e5fff3" font-family="Arial,sans-serif" font-size="20">Image encoder</text><text x="321" y="334" fill="#9ac8b8" font-family="Arial,sans-serif" font-size="13">encode &amp; index</text>
  <path d="M502 183H560M502 312H560" stroke="#74ddbe" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="568" y="132" width="220" height="230" rx="14" fill="#14282f" stroke="#47736b"/>
  <text x="590" y="168" fill="#d5f4e5" font-family="Arial,sans-serif" font-size="18">Shared vector space</text>
  <path d="M606 302L737 196M606 302L727 286M606 302L676 227" fill="none" stroke="#577c75" stroke-width="2"/>
  <circle cx="606" cy="302" r="8" fill="#f6d491"/><circle cx="737" cy="196" r="8" fill="#74ddbe"/><circle cx="727" cy="286" r="8" fill="#74ddbe"/><circle cx="676" cy="227" r="8" fill="#74ddbe"/>
  <text x="620" y="325" fill="#d6c9a9" font-family="Arial,sans-serif" font-size="13">query</text><text x="695" y="181" fill="#a5cebe" font-family="Arial,sans-serif" font-size="13">images</text>
  <path d="M790 247H847" stroke="#74ddbe" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="854" y="132" width="298" height="230" rx="14" fill="#eaf5ed"/>
  <text x="878" y="170" fill="#24443d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Ranked results</text>
  <rect x="878" y="190" width="250" height="38" rx="8" fill="#c8e8d6"/><text x="893" y="215" fill="#24443d" font-family="Arial,sans-serif" font-size="15">01  Highest similarity</text>
  <rect x="878" y="238" width="250" height="38" rx="8" fill="#d8ebe0"/><text x="893" y="263" fill="#355c50" font-family="Arial,sans-serif" font-size="15">02  Candidate image</text>
  <rect x="878" y="286" width="250" height="38" rx="8" fill="#e1efe5"/><text x="893" y="311" fill="#50766b" font-family="Arial,sans-serif" font-size="15">03  Candidate image</text>
</svg>
