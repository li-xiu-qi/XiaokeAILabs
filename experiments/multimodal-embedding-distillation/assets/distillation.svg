<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Cross-modal retrieval distillation</title><desc id="desc">A large teacher and a small student score the same text and image pairs; their score distributions form a distillation loss.</desc>
<rect width="1200" height="400" rx="24" fill="#101a21"/><text x="44" y="62" fill="#f3f4ef" font-family="sans-serif" font-size="25" font-weight="700">CROSS-MODAL RETRIEVAL DISTILLATION</text><text x="44" y="92" fill="#99b4b1" font-family="sans-serif" font-size="16">Same image–text pairs · different encoders · one ranking objective</text>
<g font-family="sans-serif"><rect x="45" y="140" width="220" height="170" rx="18" fill="#233640"/><text x="67" y="178" fill="#95d7c1" font-size="17">INPUT</text><text x="67" y="218" fill="#f3f4ef" font-size="23">Text query</text><text x="67" y="258" fill="#f3f4ef" font-size="23">Image batch</text>
<rect x="345" y="127" width="240" height="82" rx="14" fill="#284f4a"/><text x="366" y="160" fill="#9ee3c6" font-size="15">TEACHER · FROZEN</text><text x="366" y="187" fill="#fff" font-size="19">Jina v5 · similarity</text>
<rect x="345" y="239" width="240" height="82" rx="14" fill="#31414e"/><text x="366" y="271" fill="#bccbd1" font-size="15">STUDENT · TRAINABLE</text><text x="366" y="299" fill="#fff" font-size="19">BGE-VL · similarity</text>
<rect x="698" y="157" width="225" height="133" rx="16" fill="#ead8a5"/><text x="719" y="193" fill="#493d25" font-size="15">LEARNING SIGNAL</text><text x="719" y="229" fill="#1a241e" font-size="22">Pair loss + KL</text><text x="719" y="258" fill="#493d25" font-size="15">Compare distributions</text>
<rect x="1006" y="170" width="145" height="106" rx="16" fill="#a8d9c8"/><text x="1025" y="205" fill="#27463c" font-size="15">INFERENCE</text><text x="1025" y="238" fill="#13251f" font-size="19">Student only</text>
</g><g fill="none" stroke="#83bdac" stroke-width="3"><path d="M265 196 H310 V168 H337"/><path d="M265 254 H310 V280 H337"/><path d="M585 168 H640 V199 H690"/><path d="M585 280 H640 V249 H690"/><path d="M923 223 H998"/></g><g fill="#83bdac"><path d="M337 168 l-9 -5 v10z"/><path d="M337 280 l-9 -5 v10z"/><path d="M690 199 l-9 -5 v10z"/><path d="M690 249 l-9 -5 v10z"/><path d="M998 223 l-9 -5 v10z"/></g></svg>
