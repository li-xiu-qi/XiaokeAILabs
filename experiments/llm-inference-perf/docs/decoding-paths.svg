<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">自回归和投机解码的执行方式</title><desc id="desc">自回归逐 token 执行目标模型；投机解码由草稿生成候选、目标模型一起验证，接受前缀并继续。</desc>
<rect width="1200" height="470" rx="24" fill="#0e1820"/><text x="48" y="62" fill="#e8f4ed" font-family="sans-serif" font-size="30" font-weight="700">同一个目标模型，两种生成节奏</text><text x="48" y="96" fill="#9fb6b3" font-family="sans-serif" font-size="18">候选是否被接受、草稿成本和验证开销，共同决定最终速度</text>
<text x="48" y="155" fill="#78d4b5" font-family="sans-serif" font-size="22" font-weight="700">自回归</text><text x="48" y="185" fill="#9fb6b3" font-family="sans-serif" font-size="16">逐个生成</text>
<g font-family="sans-serif" font-size="19" text-anchor="middle"><rect x="230" y="125" width="170" height="66" rx="12" fill="#274550"/><text x="315" y="166" fill="#fff">目标模型 → A</text><rect x="464" y="125" width="170" height="66" rx="12" fill="#274550"/><text x="549" y="166" fill="#fff">目标模型 → B</text><rect x="698" y="125" width="170" height="66" rx="12" fill="#274550"/><text x="783" y="166" fill="#fff">目标模型 → C</text><text x="430" y="165" fill="#8fa9a4">→</text><text x="664" y="165" fill="#8fa9a4">→</text><text x="907" y="165" fill="#8fa9a4">→ …</text></g>
<path d="M48 228H1152" stroke="#31434a"/><text x="48" y="286" fill="#f0c779" font-family="sans-serif" font-size="22" font-weight="700">投机解码</text><text x="48" y="316" fill="#9fb6b3" font-family="sans-serif" font-size="16">先猜后验证</text>
<g font-family="sans-serif" font-size="19" text-anchor="middle"><rect x="230" y="255" width="190" height="70" rx="12" fill="#624d30"/><text x="325" y="298" fill="#fff">草稿：A B C</text><text x="448" y="298" fill="#8fa9a4">→</text><rect x="476" y="255" width="250" height="70" rx="12" fill="#35584c"/><text x="601" y="298" fill="#fff">目标模型并行验证</text><text x="754" y="298" fill="#8fa9a4">→</text><rect x="782" y="255" width="300" height="70" rx="12" fill="#294a47"/><text x="932" y="298" fill="#fff">接受前缀、修正并继续</text></g>
<text x="230" y="374" fill="#b1c7c2" font-family="sans-serif" font-size="17">MTP 可以提供草稿；投机解码则是验证和接受草稿的推理流程。</text><text x="48" y="433" fill="#6f8d87" font-family="sans-serif" font-size="15">XIAOKE AI LABS  /  INFERENCE MECHANICS</text></svg>
