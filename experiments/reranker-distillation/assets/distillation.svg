<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">重排序知识蒸馏</title><desc id="desc">较大的教师为查询和候选文档打分；小学生同时学习人工标签和教师对候选的相对偏好，并与同预算监督训练的学生比较。</desc><rect width="1200" height="360" rx="24" fill="#101d25"/><text x="48" y="59" font-family="sans-serif" font-size="29" font-weight="700" fill="#e9f3ef">让小模型学习教师的排序偏好</text><text x="48" y="93" font-family="sans-serif" font-size="18" fill="#a1b8b3">同一个查询、同一组候选、同一训练预算</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="140" width="225" height="98" rx="13" fill="#2a4951"/><text x="157" y="177" font-size="21" fill="#fff">查询 + 候选文档</text><text x="157" y="209" font-size="16" fill="#b9d0c7">正例与未标注文档</text><text x="301" y="195" font-size="28" fill="#8ba79e">→</text><rect x="330" y="140" width="235" height="98" rx="13" fill="#705535"/><text x="447" y="177" font-size="21" fill="#fff">教师 33M</text><text x="447" y="209" font-size="16" fill="#f2d8a3">给出相对相关性分数</text><text x="598" y="195" font-size="28" fill="#8ba79e">→</text><rect x="628" y="140" width="235" height="98" rx="13" fill="#305c4c"/><text x="745" y="177" font-size="21" fill="#fff">学生 4.39M</text><text x="745" y="209" font-size="16" fill="#b5e4c9">监督损失 + 蒸馏损失</text><text x="894" y="195" font-size="28" fill="#8ba79e">→</text><rect x="923" y="140" width="230" height="98" rx="13" fill="#354656"/><text x="1038" y="177" font-size="21" fill="#fff">留出查询评估</text><text x="1038" y="209" font-size="16" fill="#c7d4df">对照同预算监督训练</text></g><text x="48" y="307" font-family="sans-serif" font-size="17" fill="#9fb9b1">本次 SciFact 测试中，蒸馏与监督组差距很小；结果与限制见下文。</text></svg>
