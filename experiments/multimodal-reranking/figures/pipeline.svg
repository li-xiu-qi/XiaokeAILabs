<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Two-stage image retrieval</title><desc id="d">One query enters BGE retrieval over 100 images, followed by Qwen scoring on five fixed candidates.</desc><rect width="1200" height="320" rx="24" fill="#101b22"/><text x="44" y="51" fill="#86dac1" font-family="sans-serif" font-size="15" letter-spacing="3">MULTIMODAL SEARCH · TWO STAGES</text><g fill="#192e36" stroke="#38545e"><rect x="44" y="88" width="270" height="150" rx="15"/><rect x="378" y="88" width="320" height="150" rx="15"/><rect x="762" y="88" width="394" height="150" rx="15"/></g><g font-family="sans-serif" fill="#f2f7f5"><text x="67" y="126" font-size="19">QUERY + IMAGE POOL</text><text x="402" y="126" font-size="19">BGE-VL RETRIEVAL</text><text x="786" y="126" font-size="19">QWEN MULTIMODAL RERANK</text></g><g font-family="sans-serif" fill="#b1c7c5" font-size="16"><text x="67" y="169">100 text queries</text><text x="67" y="199">100 image candidates</text><text x="402" y="169">Cosine similarity</text><text x="402" y="199">Keep top 5 per query</text><text x="786" y="169">Score query-image pairs</text><text x="786" y="199">Reorder the same 5 images</text><text x="44" y="278">Fixed candidate set · images outside the top 5 cannot be recovered</text></g><g stroke="#86dac1" fill="none" stroke-width="2"><path d="M315 161h49m-10-7 10 7-10 7M699 161h49m-10-7 10 7-10 7"/></g></svg>