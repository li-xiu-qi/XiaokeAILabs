<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">两阶段图像检索</title><desc id="d">查询先用 BGE 从 100 张图片中召回候选，再由 Qwen 对固定的 5 个候选打分。</desc><rect width="1200" height="320" rx="24" fill="#101b22"/><text x="44" y="51" fill="#86dac1" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" letter-spacing="3">多模态检索 · 两阶段</text><g fill="#192e36" stroke="#38545e"><rect x="44" y="88" width="270" height="150" rx="15"/><rect x="378" y="88" width="320" height="150" rx="15"/><rect x="762" y="88" width="394" height="150" rx="15"/></g><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#f2f7f5"><text x="67" y="126" font-size="19">查询与图片库</text><text x="402" y="126" font-size="19">BGE-VL 检索</text><text x="786" y="126" font-size="19">Qwen 多模态重排</text></g><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#b1c7c5" font-size="16"><text x="67" y="169">100 条文本查询</text><text x="67" y="199">100 张候选图片</text><text x="402" y="169">余弦相似度</text><text x="402" y="199">每条查询保留前 5 张</text><text x="786" y="169">对查询与图片逐对打分</text><text x="786" y="199">重排同一批 5 张图片</text><text x="44" y="278">候选集合固定 · 无法找回前 5 名之外的图片</text></g><g stroke="#86dac1" fill="none" stroke-width="2"><path d="M315 161h49m-10-7 10 7-10 7M699 161h49m-10-7 10 7-10 7"/></g></svg>