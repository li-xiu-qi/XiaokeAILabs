<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">Jina CLIP 模型转换与验证</title><desc id="desc">文本和图片经各自编码器处理，转换为固定输入形状的 OpenVINO 模型，与 PyTorch 输出对照后分别测量 CPU 和 NPU。</desc>
<rect width="1280" height="430" rx="24" fill="#111b24"/><circle cx="1190" cy="40" r="150" fill="#193442" opacity=".55"/><text x="54" y="66" fill="#e8f4f2" font-family="Arial,sans-serif" font-size="29" font-weight="700">从多模态编码器到设备推理</text><text x="54" y="98" fill="#91a8b1" font-family="Arial,sans-serif" font-size="16">固定输入形状  ·  输出校验  ·  分别测量</text>
<g font-family="Arial,sans-serif"><rect x="54" y="151" width="195" height="175" rx="18" fill="#1d303a" stroke="#375460"/><text x="77" y="186" fill="#91a8b1" font-size="13">01 / 输入</text><text x="77" y="224" fill="#f2f8f5" font-size="19" font-weight="700">文本 · 3 × 512</text><text x="77" y="261" fill="#f2f8f5" font-size="19" font-weight="700">图像 · 512 × 512</text><text x="77" y="298" fill="#91a8b1" font-size="13">固定预处理</text>
<path d="M258 239 H291" stroke="#6dbda6" stroke-width="3"/><path d="M284 232 l8 7 -8 7" fill="none" stroke="#6dbda6" stroke-width="3"/>
<rect x="302" y="151" width="247" height="175" rx="18" fill="#1d303a" stroke="#375460"/><text x="325" y="186" fill="#91a8b1" font-size="13">02 / 转换</text><text x="325" y="224" fill="#f2f8f5" font-size="19" font-weight="700">PyTorch → IR</text><text x="325" y="261" fill="#a8d9c8" font-size="15">双分支 · FP16</text><text x="325" y="298" fill="#91a8b1" font-size="13">保留查询适配器</text>
<path d="M558 239 H591" stroke="#6dbda6" stroke-width="3"/><path d="M584 232 l8 7 -8 7" fill="none" stroke="#6dbda6" stroke-width="3"/>
<rect x="602" y="151" width="264" height="175" rx="18" fill="#1d303a" stroke="#375460"/><text x="625" y="186" fill="#91a8b1" font-size="13">03 / 验证</text><text x="625" y="224" fill="#f2f8f5" font-size="19" font-weight="700">比较向量</text><text x="625" y="261" fill="#a8d9c8" font-size="15">有限值 · 余弦 · 误差</text><text x="625" y="298" fill="#91a8b1" font-size="13">与原生输出对照</text>
<path d="M875 239 H908" stroke="#6dbda6" stroke-width="3"/><path d="M901 232 l8 7 -8 7" fill="none" stroke="#6dbda6" stroke-width="3"/>
<rect x="919" y="151" width="307" height="175" rx="18" fill="#193e3e" stroke="#58aa90"/><text x="942" y="186" fill="#a8d9c8" font-size="13">04 / 测量</text><text x="942" y="224" fill="#f2f8f5" font-size="19" font-weight="700">CPU 与 NPU</text><text x="942" y="261" fill="#d6e8dd" font-size="15">相同 IR · 固定输入</text><text x="942" y="298" fill="#a8c8be" font-size="13">预热 + 多次推理</text></g><text x="54" y="382" fill="#92a8b0" font-family="Arial,sans-serif" font-size="14">验证结论仅适用于所测输入；编译成功不等于输出正确。</text></svg>
