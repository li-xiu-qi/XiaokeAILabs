---
job: extension
config:
  name: "rzqduck_wan22_ti2v_lora_v3"
  process:
    - type: 'sd_trainer'
      training_folder: "output_v3"
      device: cuda:0
      # 第三轮（配平轮）：DGX Spark 121GB 统一内存，Wan2.2-TI2V-5B bf16 全精度 + LoRA
      # 相对第二轮的修正：
      #   1. 数据集回到严格各半：22 段，11 水景 + 11 陆地（第二轮 7 水 + 11 陆，过度校正）
      #   2. 步数 400 → 600，检验厨房等强先验场景能否被击穿
      # caption 沿用极简格式（rzqduck, <motion>）
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 150
        max_step_saves_to_keep: 4
        push_to_hub: false
      datasets:
        - folder_path: "/home/ke/XiaokeAILabs/experiments/video_finetune/wan22_ti2v_lora_train/data/rzqduck_clips_v3_full"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          num_frames: 49
          fps: 24
          resolution: [ 512 ]
      train:
        batch_size: 1
        steps: 600
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        cache_text_embeddings: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw"
        lr: 1e-4
        dtype: bf16
      model:
        name_or_path: "/home/ke/models/Wan2.2-TI2V-5B-Diffusers"
        arch: 'wan22_5b'
        quantize: false
        quantize_te: false
      sample:
        sampler: "flowmatch"
        sample_every: 300
        sample_start_step: 0
        width: 512
        height: 512
        num_frames: 49
        fps: 24
        prompts:
          # 与训练 caption 格式对齐的极简 prompt（token 打头）
          - "rzqduck sitting on a sunny windowsill next to a potted plant"
          - "rzqduck floating on a moonlit pond surrounded by fireflies"
          - "rzqduck riding a paper boat down a rainy street stream"
          - "rzqduck on a kitchen counter with rising steam from a pot"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 5.0
        sample_steps: 20
meta:
  name: "[name]"
  version: '1.0'
